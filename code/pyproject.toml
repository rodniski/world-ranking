[project]
name = "country-innovation"
version = "0.1.0"
description = "Ranking de países por viabilidade de imigração para SWE BR (modos local + remoto)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Guilherme" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "country-converter>=1.2",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
